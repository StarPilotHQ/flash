<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Install StarPilot AGNOS on your comma using a USB recovery connection.">
  <title>StarPilot Recovery</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <span class="brand">
        <img class="brand-icon" src="./assets/starpilot.svg" alt="">
        <img class="wordmark" src="./assets/wordmark.png" alt="StarPilot">
      </span>
      <span class="release">AGNOS <span id="version" aria-live="polite">…</span></span>
    </header>
    <h1>USB Recovery</h1>
    <p class="lede">Install StarPilot AGNOS on your comma.</p>
    <section aria-labelledby="connection">
      <h2 id="connection">Connect your comma</h2>
      <p>Disconnect your comma from the car and connect its recovery USB port. Keep the same USB connection for the entire recovery.</p>
      <a href="https://flash.comma.ai/" target="_blank" rel="noopener">View comma’s port guide</a>
    </section>
    <section aria-labelledby="menu-heading">
      <h2 id="menu-heading">Recovery options</h2>
      <div class="choice install-choice">
        <label for="flash"><input type="checkbox" id="flash" checked> <span><strong>Flash AGNOS</strong><small>Write the selected branch’s AGNOS to the inactive boot slot.</small></span></label>
        <div class="branch-choice">
          <label class="channel">Branch
            <select id="branch">
              <option value="stable">Stable</option>
              <option value="testing">Testing</option>
            </select>
          </label>
          <label class="other-choice"><input type="checkbox" id="other"> Other</label>
        </div>
      </div>
      <div class="choice fork-fields" id="fork-fields" hidden>
        <label class="channel">GitHub username <input id="fork-owner" type="text" maxlength="39" spellcheck="false" autocapitalize="none"></label>
        <label class="channel">Branch <input id="fork-branch" type="text" maxlength="160" spellcheck="false" autocapitalize="none"></label>
      </div>
      <label class="choice"><input type="checkbox" id="erase"> <span><strong>Delete old data</strong><small>Erase installed software, settings, and cache.</small></span></label>
      <label class="choice"><input type="checkbox" id="install"> <span><strong id="install-label">Install StarPilot</strong><small>Install the latest commit on the selected branch. Requires Delete old data.</small></span></label>
      <div class="choice install-choice">
        <label for="preload"><input type="checkbox" id="preload"> <span><strong>Pre-load SSH key</strong><small>Give the owner of this GitHub account SSH access.</small></span></label>
        <label id="username-row" class="channel" hidden>GitHub username
          <input id="username" type="text" maxlength="39" spellcheck="false" autocapitalize="none" autocomplete="off">
        </label>
      </div>
      <div class="choice install-choice">
        <label for="wifi"><input type="checkbox" id="wifi" disabled> <span><strong>Save a Wi-Fi network</strong><small>Supports WPA2 Personal. Requires Delete old data.</small></span></label>
        <div id="wifi-fields" hidden>
          <label class="channel">Network name <input id="wifi-name" type="text" spellcheck="false" autocomplete="off"></label>
          <label class="channel">Wi-Fi password <input id="wifi-password" type="password" maxlength="64" autocomplete="off"></label>
        </div>
      </div>
      <button type="button" id="start">Start recovery</button>
    </section>
    <section class="result" aria-labelledby="status-heading">
      <h2 id="status-heading">Recovery status</h2>
      <p id="status" role="status" aria-live="polite">Waiting for a USB connection.</p>
      <progress id="progress" aria-label="Current operation progress" max="100" hidden></progress>
      <p id="error" role="alert" hidden></p>
    </section>
  </main>
</body>
</html>
